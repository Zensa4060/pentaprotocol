[phases.setup]
nixPkgs = ["python3", "python3Packages.pip", "rustc", "cargo", "gcc"]

[phases.install]
cmds = [
    "python3 -m pip install maturin",
    "python3 -m pip install rust_engine/",
    "python3 -m pip install -r requirements.txt"
]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port 8080"
