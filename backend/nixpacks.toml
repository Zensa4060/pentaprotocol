[phases.setup]
nixPkgs = ["python313", "python313Packages.pip", "rustc", "cargo", "gcc"]

[phases.install]
cmds = [
  "python -m venv .venv",
  ".venv/bin/pip install -r requirements.txt"
]

[phases.build]
cmds = [
  ".venv/bin/pip install maturin",
  ".venv/bin/pip install rust_engine/"
]

[start]
cmd = ".venv/bin/uvicorn main:app --host 0.0.0.0 --port 8080"
